<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <!-- Defs for Gradients and Filters -->
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2B258" />
      <stop offset="100%" stop-color="#D99A45" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FE0D7" />
      <stop offset="100%" stop-color="#65B8B0" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242B36" />
      <stop offset="100%" stop-color="#181D24" />
    </linearGradient>
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A323F" />
      <stop offset="100%" stop-color="#1B2028" />
    </linearGradient>
  </defs>

  <!-- Script Sheet (Behind Clapperboard) -->
  <rect x="18" y="6" width="22" height="28" rx="3" fill="#151920" stroke="#303743" stroke-width="1.5" />
  <!-- Screenplay Script Lines -->
  <line x1="23" y1="12" x2="35" y2="12" stroke="#65B8B0" stroke-width="1.8" stroke-linecap="round" />
  <line x1="23" y1="17" x2="32" y2="17" stroke="#A6A6A6" stroke-width="1.4" stroke-linecap="round" opacity="0.7" />
  <line x1="23" y1="22" x2="36" y2="22" stroke="#A6A6A6" stroke-width="1.4" stroke-linecap="round" opacity="0.7" />
  <line x1="23" y1="27" x2="29" y2="27" stroke="#D99A45" stroke-width="1.4" stroke-linecap="round" opacity="0.9" />

  <!-- Main Clapperboard Body -->
  <rect x="6" y="20" width="30" height="22" rx="3.5" fill="url(#slateGrad)" stroke="#303743" stroke-width="1.5" />

  <!-- Production Data Grid on Clapper -->
  <line x1="6" y1="28" x2="36" y2="28" stroke="#303743" stroke-width="1" />
  <line x1="21" y1="28" x2="21" y2="42" stroke="#303743" stroke-width="1" />
  
  <!-- Neural / RAG Node Connectivity on Clapper slate -->
  <circle cx="12" cy="35" r="2" fill="url(#amberGrad)" />
  <circle cx="28" cy="32" r="1.8" fill="url(#tealGrad)" />
  <circle cx="30" cy="38" r="1.5" fill="#F4EBDD" opacity="0.8" />
  <line x1="12" y1="35" x2="28" y2="32" stroke="#D99A45" stroke-width="1" stroke-dasharray="2 1.5" opacity="0.85" />
  <line x1="28" y1="32" x2="30" y2="38" stroke="#65B8B0" stroke-width="1" opacity="0.75" />

  <!-- Clapper Top Sticks (Angled Open 15 degrees) -->
  <g transform="rotate(-12 6 20)">
    <!-- Top Clapper Stick Bar -->
    <rect x="5" y="13" width="32" height="7" rx="1.8" fill="url(#stickGrad)" stroke="#303743" stroke-width="1.2" />
    
    <!-- Chevrons / Stripes -->
    <path d="M9 13.5 L13 19.5" stroke="#D99A45" stroke-width="2.5" stroke-linecap="round" />
    <path d="M16 13.5 L20 19.5" stroke="#F4EBDD" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <path d="M23 13.5 L27 19.5" stroke="#65B8B0" stroke-width="2.5" stroke-linecap="round" />
    <path d="M30 13.5 L34 19.5" stroke="#F4EBDD" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    
    <!-- Pivot Pin -->
    <circle cx="7.5" cy="16.5" r="1.4" fill="#D99A45" />
  </g>
</svg>

